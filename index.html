:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10151e;color:#e9edf3}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:18px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}h1{font-size:20px;letter-spacing:.12em;margin:0}small,.help{color:#a8b4c5}button{font:inherit;background:#293b54;color:#fff;border:1px solid #506782;border-radius:8px;padding:10px 16px;cursor:pointer}.toolbar{display:flex;gap:6px}.toolbar button{font-size:12px;padding:7px 10px}button:focus-visible{outline:2px solid #91c3ff}button:disabled{opacity:.4}.screen{background:#000;border:1px solid #344456;border-radius:9px;overflow:hidden;height:min(66vh,660px);display:flex;align-items:center;justify-content:center;position:relative}canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;outline:none}#gate{position:absolute;text-align:center;background:#10151ee8;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}#gate[hidden],[hidden]{display:none!important}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}p{line-height:1.6}.help{font-size:13px}#status,#audio-status{font-size:13px;margin:5px 0;min-height:1em}progress{width:100%;height:4px}kbd{border:1px solid #506782;border-radius:3px;padding:1px 4px;color:#e9edf3}footer{color:#7f90a7;font-size:12px;margin:12px 0}

</style></head><body><main><header><h1>NIGHT <small>WEB</small></h1><div class="toolbar"><button id="toggle-controls" aria-pressed="false">화면 버튼</button><button id="landscape" class="mobile-landscape">가로 모드</button><button id="sound">소리</button><button id="fullscreen">전체 화면</button><button id="restart">재시작</button></div></header>
<section id="play-area" aria-label="게임"><button id="exit-landscape">가로 모드 종료</button><button class="fullscreen-exit" id="exit-fullscreen">화면 축소</button><div class="screen" id="screen"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas><div id="gate"><strong>NIGHT</strong><small>처음에 약 51MB를 불러옵니다. 음악은 필요한 곡만 받습니다.</small><div class="controls"><button id="start">게임 시작</button><button id="select">스테이지 선택</button></div></div></div>
<div id="controller" class="disabled" aria-label="가상 컨트롤러"><div id="utility"><button data-key="Enter">확인 <small>Enter</small></button><button data-key="Escape">일시정지 / 뒤로</button></div><div id="dpad" role="group" aria-label="방향 패드: 드래그하여 8방향 이동"><div id="stick-base"><span class="north" data-direction="ArrowUp">&#8593;</span><span class="west" data-direction="ArrowLeft">&#8592;</span><span class="east" data-direction="ArrowRight">&#8594;</span><span class="south" data-direction="ArrowDown">&#8595;</span><div id="knob"></div></div></div><div id="actions"><button id="punch" data-key="z">펀치<small>Z</small></button><button id="kick" data-key="x">킥<small>X</small></button><button data-key="f">점프<small>F</small></button><button data-key=" ">가드<small>Space</small></button></div></div></section>
<progress id="progress" max="1" value="0"></progress><p id="status" role="status">Ready</p><p id="audio-status" role="status"></p>
<p class="help"><kbd>방향키</kbd> 이동 &nbsp; <kbd>Z</kbd> 펀치 &nbsp; <kbd>X</kbd> 킥 &nbsp; <kbd>F</kbd> 점프 &nbsp; <kbd>Space</kbd> 가드 &nbsp; <kbd>Enter</kbd> 확인 &nbsp; <kbd>Esc</kbd> 일시정지 / 뒤로<br>화면 왼쪽에서 터치하면 그곳에 조이스틱이 나타납니다. 드래그하여 이동하고 손을 떼면 사라집니다. 공격 버튼과 동시에 누를 수 있습니다.</p><footer>NIGHT WEB</footer>
<script>
const canvas=document.getElementById('canvas'),statusEl=document.getElementById('status'),audioStatus=document.getElementById('audio-status');
const params=new URLSearchParams(location.search);
const MUSIC_VERSION='92d3615d214a';
const GAME_VERSION='843515053159';
const GAME_STEM='game-smooth';
let stageMode=params.get('mode')==='select',started=false;
globalThis.NightMusic={track:0,audio:new Audio(),blocked:false,
 play(track){this.stop();this.track=track;this.audio.loop=true;this.audio.preload='auto';this.audio.src='assets/music/track'+String(track).padStart(2,'0')+'.ogg?v='+MUSIC_VERSION;this.attempt();},
 attempt(){if(!this.track)return;const track=this.track;this.audio.play().then(()=>{if(this.track===track){this.blocked=false;audioStatus.textContent='';}}).catch(err=>{if(this.track!==track||err.name==='AbortError')return;this.blocked=true;audioStatus.textContent=err.name==='NotAllowedError'?'Press Enable sound to play music.':'Music could not load. Gameplay can continue.';});},
 stop(){this.track=0;this.audio.pause();this.audio.removeAttribute('src');this.audio.load();},
 unlock(){const ctx=globalThis.Module&&Module.SDL2&&Module.SDL2.audioContext;if(ctx&&ctx.state==='suspended')ctx.resume();if(this.blocked)this.attempt();}
};
NightMusic.audio.addEventListener('error',()=>{if(NightMusic.track)audioStatus.textContent='Music could not load. Gameplay can continue.';});
var Module={canvas,arguments:[],locateFile:(path,prefix)=>prefix+path+'?v='+GAME_VERSION,print:msg=>console.log(msg),printErr:msg=>console.error(msg),
 setStatus(text){statusEl.textContent=text;const m=/\((\d+)\/(\d+)\)/.exec(text);if(m)document.getElementById('progress').value=Number(m[1])/Number(m[2]);},
 onRuntimeInitialized(){controllerReady(true);statusEl.textContent='Running';document.getElementById('progress').value=1;canvas.focus({preventScroll:true});},
 onAbort(reason){statusEl.textContent='Game failed to start: '+reason;},
 onExit(code){controllerReady(false);Module.exitCode=code;statusEl.textContent=code===0?'Game ended. Press Restart to play again.':'Game ended with an error ('+code+').';NightMusic.stop();}
};
async function loadCompressedGameFile(name,label){
 const response=await fetch(name+'.gz?v='+GAME_VERSION);
 if(!response.ok)throw new Error(label+' download failed ('+response.status+')');
 const total=Number(response.headers.get('Content-Length'))||0;let received=0;
 const tracked=response.body.pipeThrough(new TransformStream({transform(chunk,controller){received+=chunk.byteLength;Module.setStatus('Downloading '+label+'... ('+received+'/'+(total||received)+')');controller.enqueue(chunk);}}));
 const bytes=await new Response(tracked).arrayBuffer();
 const magic=new Uint8Array(bytes,0,Math.min(2,bytes.byteLength));
 // Some hosts set Content-Encoding even on .gz URLs; fetch then already decoded it.
 if(magic[0]!==0x1f||magic[1]!==0x8b)return bytes;
 statusEl.textContent='Preparing '+label+'...';
 return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
}
async function start(select){if(started)return;started=true;stageMode=select;Module.arguments=select?['--stage-select']:[];
 // Verification mode runs the same compiled smoke paths and exits.
 const smoke=params.get('check');if(smoke&&/^smoke-[a-z0-9-]+$/.test(smoke))Module.arguments=['--'+smoke];
 document.getElementById('gate').hidden=true;statusEl.textContent='Loading game data...';
 try {
 if(typeof DecompressionStream!=='function')throw new Error('Please update your browser to load this compressed game.');
 if(typeof DecompressionStream==='function'){
  let [packageData,wasmData]=await Promise.all([loadCompressedGameFile(GAME_STEM+'.data','game data'),loadCompressedGameFile(GAME_STEM+'.wasm','game engine')]);
  Module.getPreloadedPackage=()=>{const data=packageData;packageData=null;return data;};
  Module.instantiateWasm=(imports,receive)=>{
   WebAssembly.instantiate(wasmData,imports).then(result=>{wasmData=null;receive(result.instance,result.module);}).catch(error=>Module.onAbort(error.message));
   return {};
  };
 }
 const script=document.createElement('script');script.src=GAME_STEM+'.js?v='+GAME_VERSION;script.onerror=()=>{statusEl.textContent='Could not load '+script.src+'. Upload the complete contents of NightPort-Web.zip, then refresh.';};document.body.appendChild(script);
 }catch(error){started=false;document.getElementById('gate').hidden=false;statusEl.textContent='Game download failed: '+error.message;}
}
document.getElementById('start').onclick=()=>start(false);document.getElementById('select').onclick=()=>start(true);
document.getElementById('sound').onclick=()=>{NightMusic.unlock();canvas.focus({preventScroll:true});};
document.getElementById('exit-fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();};
document.getElementById('restart').onclick=()=>{location.href=location.pathname+(stageMode?'?mode=select':'');};
document.getElementById('fullscreen').onclick=()=>{const area=document.getElementById('play-area');if(document.fullscreenElement)document.exitFullscreen();else if(area.requestFullscreen)area.requestFullscreen().catch(()=>{});canvas.focus({preventScroll:true});};
let landscapeMode=false,landscapeToken=0,controlsBeforeLandscape=false;
function updateLandscape(){if(!landscapeMode)return;releaseAll();document.body.classList.toggle('landscape-rotated',innerHeight>innerWidth);}
function leaveLandscape(){++landscapeToken;landscapeMode=false;releaseAll();document.body.classList.remove('landscape-mode','landscape-rotated');showController(controlsBeforeLandscape);canvas.focus({preventScroll:true});}
async function enterLandscape(){if(landscapeMode)return;const token=++landscapeToken;
 // Fullscreen elements ignore CSS transforms. Leave it before rotating the page.
 if(document.fullscreenElement){try{await document.exitFullscreen();}catch(_){return;}}
 if(token!==landscapeToken)return;
 controlsBeforeLandscape=!controller.hidden;landscapeMode=true;document.body.classList.add('landscape-mode');showController(true);updateLandscape();canvas.focus({preventScroll:true});
}
document.getElementById('landscape').onclick=enterLandscape;document.getElementById('exit-landscape').onclick=leaveLandscape;
addEventListener('resize',updateLandscape);addEventListener('orientationchange',updateLandscape);
for(const type of ['keydown','keyup'])addEventListener(type,event=>{if(['F2','F3','F4','F5','F6','F7','PageUp','PageDown','e','E','m','M','[',']'].includes(event.key)){event.preventDefault();event.stopImmediatePropagation();}},{capture:true});
addEventListener('keydown',event=>{NightMusic.unlock();if(started&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','F1','F7'].includes(event.key)&&event.target.tagName!=='INPUT')event.preventDefault();});
addEventListener('pointerdown',()=>NightMusic.unlock());
const codes={ArrowLeft:37,ArrowUp:38,ArrowDown:40,ArrowRight:39,x:88,z:90,f:70,' ':32,Enter:13,Escape:27};
const pointers=new Map(),owners=new Map();let controllerScrollAnchor=null;
function sendKey(key,down){canvas.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',{key,code:key===' '?'Space':key.length===1?'Key'+key.toUpperCase():key,keyCode:codes[key],which:codes[key],bubbles:true,cancelable:true}));}
function setKeys(id,next){const previous=pointers.get(id)||new Set();
 for(const k of previous)if(!next.has(k)){const refs=owners.get(k);if(refs){refs.delete(id);if(!refs.size){owners.delete(k);sendKey(k,false);}}}
 for(const k of next)if(!previous.has(k)){if(!owners.has(k)){owners.set(k,new Set());sendKey(k,true);}owners.get(k).add(id);}
 if(next.size)pointers.set(id,next);else pointers.delete(id);
 for(const button of document.querySelectorAll('[data-key]'))button.classList.toggle('pressed',owners.has(button.dataset.key));
 for(const arrow of document.querySelectorAll('[data-direction]'))arrow.classList.toggle('pressed',owners.has(arrow.dataset.direction));
}
const pad=document.getElementById('dpad'),knob=document.getElementById('knob'),stickBase=document.getElementById('stick-base');let padPointer=null,padOrigin=null;
function resetPad(){padPointer=null;padOrigin=null;pad.classList.remove('active');knob.style.transform='translate(-50%,-50%)';}
function release(id){setKeys(id,new Set());if(id===padPointer)resetPad();if(!pointers.size&&padPointer===null)controllerScrollAnchor=null;}
function releaseAll(){for(const id of Array.from(pointers.keys()))release(id);resetPad();controllerScrollAnchor=null;}
function padPoint(e){const r=pad.getBoundingClientRect();let x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;if(document.body.classList.contains('landscape-rotated'))[x,y]=[y,1-x];return {x:x*pad.clientWidth,y:y*pad.clientHeight};}
function padKeys(e){if(!padOrigin)return;const point=padPoint(e),radius=Math.min(pad.clientWidth,pad.clientHeight)/2,dx=(point.x-padOrigin.x)/radius,dy=(point.y-padOrigin.y)/radius;const keys=new Set();
 if(Math.hypot(dx,dy)>.24){if(Math.abs(dx)>.35*Math.abs(dy))keys.add(dx<0?'ArrowLeft':'ArrowRight');if(Math.abs(dy)>.35*Math.abs(dx))keys.add(dy<0?'ArrowUp':'ArrowDown');}
 setKeys(e.pointerId,keys);const scale=Math.max(1,Math.hypot(dx,dy));knob.style.transform='translate(calc(-50% + '+dx/scale*25+'px),calc(-50% + '+dy/scale*25+'px))';
}
const stickArea=document.getElementById('play-area');
stickArea.addEventListener('pointerdown',e=>{if(!controlsReady||controller.hidden||padPointer!==null||e.target.closest('button,#gate'))return;
 const r=stickArea.getBoundingClientRect();const horizontal=document.body.classList.contains('landscape-rotated')?(e.clientY-r.top)/r.height:(e.clientX-r.left)/r.width;if(horizontal>.5)return;
 e.preventDefault();e.stopPropagation();padPointer=e.pointerId;padOrigin=padPoint(e);stickBase.style.left=padOrigin.x+'px';stickBase.style.top=padOrigin.y+'px';pad.classList.add('active');stickArea.setPointerCapture(e.pointerId);canvas.focus({preventScroll:true});padKeys(e);
},{capture:true});
stickArea.addEventListener('pointermove',e=>{if(e.pointerId===padPointer){e.preventDefault();e.stopPropagation();padKeys(e);}},{capture:true});
for(const type of ['pointerup','pointercancel','lostpointercapture'])stickArea.addEventListener(type,e=>{if(e.pointerId===padPointer){e.preventDefault();e.stopPropagation();release(e.pointerId);}},{capture:true});
for(const button of document.querySelectorAll('[data-key]')){
 button.onpointerdown=e=>{if(!controlsReady)return;e.preventDefault();button.setPointerCapture(e.pointerId);canvas.focus({preventScroll:true});setKeys(e.pointerId,new Set([button.dataset.key]));};
 for(const type of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(type,e=>release(e.pointerId));
}
let controlsReady=false;
function controllerReady(ready){controlsReady=ready;if(!ready)releaseAll();document.getElementById('controller').classList.toggle('disabled',!ready);}
const toggle=document.getElementById('toggle-controls'),controller=document.getElementById('controller');
function showController(show){releaseAll();controller.hidden=!show;toggle.setAttribute('aria-pressed',String(show));document.getElementById('play-area').classList.toggle('has-controls',show);}
showController(matchMedia('(pointer:coarse)').matches||innerWidth<900);
toggle.onclick=()=>showController(controller.hidden);
controller.addEventListener('pointerdown',e=>{if(!controlsReady)return;if(!controllerScrollAnchor)controllerScrollAnchor={x:scrollX,y:scrollY};e.preventDefault();},{capture:true,passive:false});
for(const type of ['touchstart','touchmove','touchend'])controller.addEventListener(type,e=>e.preventDefault(),{passive:false});
addEventListener('scroll',()=>{if(controllerScrollAnchor&&(pointers.size||padPointer!==null)&&(scrollX!==controllerScrollAnchor.x||scrollY!==controllerScrollAnchor.y))scrollTo(controllerScrollAnchor.x,controllerScrollAnchor.y);},{passive:true});
addEventListener('resize',releaseAll);addEventListener('orientationchange',releaseAll);addEventListener('blur',releaseAll);addEventListener('pagehide',releaseAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();});document.addEventListener('fullscreenchange',releaseAll);
globalThis.NightControls={get heldKeys(){return Array.from(owners.keys());},releaseAll};
if(params.get('autostart')==='1')start(stageMode);
</script></main></body></html>
